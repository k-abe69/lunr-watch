# 毎日1回、収集 → data/ を保存（コミット） → 閲覧サイトを GitHub Pages へ公開。
# 公開リポジトリなら Actions・Pages とも無料（クレジットカード登録不要）。標準ランナーのみ使用し、有料機能は使わない。
name: daily-collect
on:
  schedule:
    - cron: "17 22 * * *"  # UTC 22:17 = 日本時間 07:17（毎時0分は高負荷で遅延しやすいと公式に明記されているためずらす）。時刻を変える場合はここだけ編集する（GitHub側の都合で数分〜1時間ほど遅れることがある）
  workflow_dispatch: {}     # 手動実行（Actionsタブの「Run workflow」）

permissions:
  contents: write           # data/ のコミットに必要
  pages: write
  id-token: write

concurrency:
  group: lunr-watch
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        env:
          LUNRWATCH_CONTACT: ${{ vars.LUNRWATCH_CONTACT }}   # 推奨。SEC等へ送るUser-Agentの連絡先（本人のもの）。未設定でも動くが、8-K本文の抜粋は取得しない
        run: python -m lunrwatch run
      - name: Commit data
        run: |
          git config user.name "lunr-watch-bot"
          git config user.email "lunr-watch-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
